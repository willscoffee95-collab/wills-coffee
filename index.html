      .hero-system-title{font-size:15px;margin-top:13px}
      .system-pill{right:12px;top:14px;height:27px;padding:0 8px;font-size:7.8px}
      .content{margin-top:-42px;padding:0 11px 30px}
      .role-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
      .role-card,.role-card[data-action="kasir"],.role-card[data-action="finance"],.role-card[data-action="hr"],.role-card[data-action="investor"]{min-height:118px;padding:14px;border-radius:20px}
      .role-card[data-action="owner"]{min-height:92px;padding:14px;grid-template-columns:43px 1fr auto;column-gap:11px}
      .role-card[data-action="owner"] .role-icon{width:43px;height:43px}
      .role-card b,.role-card[data-action="owner"] b{font-size:13px}.role-card span{font-size:8.7px}
      .bean.b2{right:13%;top:13%}.bean.b3{display:none}
    }
    @media(max-width:460px){
      .hero{min-height:270px}.role-grid{grid-template-columns:1fr 1fr}.home-label{margin-left:2px}
      .role-card{min-width:0}.role-card span{max-width:150px}
      .system-pill span{display:none}.system-pill{width:28px;padding:0;justify-content:center}
    }

  </style>
</head>
<body>
<div id="shell">
  <section class="hero">
    <div class="hero-decor" aria-hidden="true"><span class="hero-wave w1"></span><span class="hero-wave w2"></span><span class="bean b1"></span><span class="bean b2"></span><span class="bean b3"></span></div>
    <div class="system-pill" id="systemPill"><i></i><span id="systemStatus">System Online</span></div>
    <div class="hero-center"><div class="hero-logo"><img src="wills-logo.png" alt="Wills Coffee"></div><div class="hero-system-title">Operational System</div></div>
  </section>
  <main class="content"><div class="panel" id="panel"></div></main>
</div>
<div id="viewer">
  <div class="viewer-bar"><button class="viewer-back" id="viewerBack" aria-label="Kembali satu halaman">‹</button><button class="viewer-home" id="viewerHome" aria-label="Beranda aplikasi">⌂</button><div class="viewer-title"><b id="viewerTitle">Wills Coffee</b><span id="viewerSub">Memuat…</span></div><button class="viewer-reload" id="viewerReload">Muat ulang</button></div>
  <div id="frameWrap"><iframe id="appFrame" title="Wills Coffee" allow="clipboard-read; clipboard-write; fullscreen; autoplay" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
  <div id="viewerLoading"><div class="viewer-load-card"><div class="viewer-spinner"></div><div id="viewerLoadingText">Memuat Wills System…</div></div></div>
</div>
<div id="splash"><div class="splash-card"><img src="wills-logo.png" alt="Wills Coffee"><div class="splash-title">Wills Coffee</div><div class="splash-sub">Menyiapkan Wills System…</div><div class="loader"></div></div></div>
<div id="offline"><span>Koneksi internet terputus. Sistem Wills membutuhkan koneksi.</span><button id="reloadNet">Muat Ulang</button></div>
<div id="installCard"><button id="closeInstall" aria-label="Tutup">×</button><img src="wills-logo.png" alt=""><div class="install-copy"><strong>Pasang Wills Coffee</strong><span>Buka Wills System dari Home Screen tanpa address bar.</span></div><button id="installBtn">Pasang</button></div>
<script src="config.js?v=10872"></script>
<script>
(()=>{
  const C=window.WILLS_CONFIG;
  const panel=document.getElementById('panel');
  const viewer=document.getElementById('viewer'),frame=document.getElementById('appFrame'),viewerTitle=document.getElementById('viewerTitle'),viewerSub=document.getElementById('viewerSub'),viewerLoading=document.getElementById('viewerLoading'),viewerLoadingText=document.getElementById('viewerLoadingText');
  let currentUrl='',currentScreen='home',viewerBackTimer=null,viewerBackAck=false,historyArmed=false,touchStartY=0;
  const outletById=id=>C.outlets.find(x=>x.id===id);
  const withParam=(base,key,value)=>base+(base.includes('?')?'&':'?')+encodeURIComponent(key)+'='+encodeURIComponent(value);
  const route=(outlet,app)=>withParam(outlet.base,'app',app);
  const centralRoute=section=>withParam(withParam(C.masterBase||C.ownerAllOutletUrl,'app','owner'),'section',section);
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function setHero(){window.scrollTo(0,0)}
  function backHead(title,sub,back){return `<div class="screen-head"><button class="back" data-action="${back}">‹</button><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div></div>`}
  function roleIcon(type){
    const icons={
      kasir:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M7 7h10M7 11h4m3 0h3M7 15h3m3 0h4M7 18h10"/></svg>',
      owner:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-5 3.4-7 8-7s7.2 2 8 7M18 5l2-2m-14 2L4 3"/></svg>',
      investor:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m5 10V5m5 15v-7m5 7V8"/><path d="M3 20h18"/></svg>',
      finance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 10h18M7 15h4"/></svg>',
      hr:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c.6-4 2.6-6 6-6s5.4 2 6 6m0-5c3 0 5 1.5 6 5"/></svg>'
    };return icons[type]||icons.kasir;
  }
  function cardIcon(type){return '<span class="badge role-mini">'+roleIcon(type)+'</span>';}
  function home(push=true){currentScreen='home';setHero();panel.innerHTML=`<div class="home-label">Pilih akses</div><div class="role-grid"><button class="role-card" data-action="kasir"><div class="role-icon">${roleIcon('kasir')}</div><b>Kasir</b><span>Transaksi dan operasional harian outlet.</span></button><button class="role-card" data-action="finance"><div class="role-icon">${roleIcon('finance')}</div><b>Finance</b><span>Arus kas & rekonsiliasi.</span></button><button class="role-card" data-action="hr"><div class="role-icon">${roleIcon('hr')}</div><b>HR</b><span>Tim, jadwal & payroll.</span></button><button class="role-card" data-action="investor"><div class="role-icon">${roleIcon('investor')}</div><b>Investor</b><span>Dashboard dan laporan investor.</span></button><button class="role-card" data-action="owner"><div class="role-icon">${roleIcon('owner')}</div><b>Owner</b><span>Monitoring dan kontrol seluruh cabang.</span></button></div>`;if(push)pushLauncherState('home')}
  function outletList(role,push=true){currentScreen=role;const label=role==='kasir'?'Kasir':'Owner';setHero(label+' Wills Coffee','Pilih outlet yang ingin dibuka.');const allOwner=role==='owner'?`<button class="outlet-card all-card" data-action="ownerall"><span class="outlet-left"><span class="badge logo-badge"><img src="wills-logo.png" alt="Wills Coffee"></span><span><b>Laporan All Outlet</b><small>Performa harian, penjualan, balancing, dan QC produksi 5 outlet</small></span></span><span class="arrow">›</span></button>`:'';panel.innerHTML=backHead('Pilih Outlet',label+' • 5 outlet','home')+`<div class="outlet-grid">${C.outlets.map(o=>`<button class="outlet-card" data-open-role="${role}" data-outlet="${o.id}"><span class="outlet-left">${cardIcon(role)}<span><b>${esc(o.name)}</b><small>${esc(o.code)} • ${label} Outlet ${esc(o.name)}</small></span></span><span class="arrow">›</span></button>`).join('')}${allOwner}</div>`;if(push)pushLauncherState(role)}
  function investorHome(push=true){currentScreen='investor';setHero('Investor Wills Coffee','Pilih akses investor. Identitas investor tidak ditampilkan di launcher.');panel.innerHTML=backHead('Investor','Dashboard dan laporan','home')+`<div class="outlet-grid"><button class="investor-card" data-action="investor1"><span class="outlet-left">${cardIcon('investor')}<span><b>Investor 1</b><small>Pasar Rebo • Tegal Munjul • UPI • All Outlet</small></span></span><span class="arrow">›</span></button><button class="investor-card" data-direct-investor="2"><span class="outlet-left">${cardIcon('investor')}<span><b>Investor 2</b><small>Dashboard Investor Cikopak</small></span></span><span class="arrow">›</span></button><button class="investor-card" data-direct-investor="3"><span class="outlet-left">${cardIcon('investor')}<span><b>Investor 3</b><small>Dashboard Investor Cipaisan</small></span></span><span class="arrow">›</span></button></div><div class="note">Dashboard investor outlet tetap memakai login/password dari masing-masing sistem outlet.</div>`;if(push)pushLauncherState('investor')}
  function investor1(push=true){currentScreen='investor1';setHero('Investor 1','Pilih dashboard outlet atau lihat laporan gabungan tiga outlet.');const ids=C.investors.investor1.outletIds;panel.innerHTML=backHead('Investor 1','Pasar Rebo • Tegal Munjul • UPI','investor')+`<div class="outlet-grid">${ids.map(id=>{const o=outletById(id);return `<button class="outlet-card" data-investor-outlet="${o.id}"><span class="outlet-left">${cardIcon('investor')}<span><b>${esc(o.name)}</b><small>${esc(o.code)} • Dashboard Investor ${esc(o.name)}</small></span></span><span class="arrow">›</span></button>`}).join('')}<button class="outlet-card all-card" data-action="alloutlet"><span class="outlet-left"><span class="badge logo-badge"><img src="wills-logo.png" alt="Wills Coffee"></span><span><b>Laporan All Outlet</b><small>Performa gabungan Pasar Rebo, Tegal Munjul, dan UPI</small></span></span><span class="arrow">›</span></button></div>`;if(push)pushLauncherState('investor1')}

  function showViewerLoading(text){viewerLoadingText.textContent=text||'Memuat Wills System…';viewerLoading.classList.add('show')}
  function hideViewerLoading(){viewerLoading.classList.remove('show')}
  function pushLauncherState(screen){try{history.pushState({wills:true,screen},'',location.href);historyArmed=true}catch(e){}}
  function ensureRootGuard(){if(historyArmed)return;try{history.replaceState({wills:true,screen:'home'},'',location.href);history.pushState({wills:true,screen:'home'},'',location.href);historyArmed=true}catch(e){}}
  function openViewer(url,title,sub){if(!url)return;currentUrl=url;viewerTitle.textContent=title;viewerSub.textContent=sub||'Wills Coffee';showViewerLoading('Memuat '+title+'…');frame.src=url;viewer.classList.add('show');try{history.pushState({wills:true,screen:'viewer'},'',location.href)}catch(e){}}
  function closeViewer(){clearTimeout(viewerBackTimer);viewerBackTimer=null;viewerBackAck=false;frame.src='about:blank';currentUrl='';viewer.classList.remove('show');hideViewerLoading()}
  function requestInnerBack(fallback=true){if(!viewer.classList.contains('show'))return false;viewerBackAck=false;clearTimeout(viewerBackTimer);try{frame.contentWindow.postMessage({type:'WILLS_PWA_BACK',source:'github-pwa-v10.8.7.2'},'*')}catch(e){}if(fallback){viewerBackTimer=setTimeout(()=>{if(!viewerBackAck&&viewer.classList.contains('show')){closeViewer();pushLauncherState(currentScreen||'home')}},320)}return true}
  function ownerAll(){if(!C.ownerAllOutletUrl){panel.insertAdjacentHTML('beforeend','<div class="note warn">Portal Owner All Outlet belum dihubungkan.</div>');return}openViewer(C.ownerAllOutletUrl,'Owner • All Outlet','5 Outlet • Wills Coffee')}
  function openCentral(section){const base=C.masterBase||C.ownerAllOutletUrl;if(!base){panel.insertAdjacentHTML('beforeend','<div class="note warn">URL Master Core belum diisi di config.js.</div>');return}openViewer(centralRoute(section),section==='finance'?'Finance Wills':'HR Wills',section==='finance'?'Finance Center • Semua Outlet':'HR Center • Semua Outlet')}
  function allOutlet(){if(!C.investor1AllOutletUrl){panel.insertAdjacentHTML('beforeend','<div class="note warn">Portal Laporan All Outlet belum dihubungkan.</div>');return}openViewer(C.investor1AllOutletUrl,'Investor 1 • All Outlet','Pasar Rebo + Tegal Munjul + UPI')}

  panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='home')return home();if(a==='kasir'||a==='owner')return outletList(a);if(a==='finance'||a==='hr')return openCentral(a);if(a==='investor')return investorHome();if(a==='investor1')return investor1();if(a==='ownerall')return ownerAll();if(a==='alloutlet')return allOutlet();if(b.dataset.openRole){const o=outletById(b.dataset.outlet),role=b.dataset.openRole;return openViewer(route(o,role==='kasir'?'kasir':'owner'),(role==='kasir'?'Kasir':'Owner')+' • '+o.name,o.code+' • Wills Coffee')}if(b.dataset.investorOutlet){const o=outletById(b.dataset.investorOutlet);return openViewer(route(o,'portal'),'Investor 1 • '+o.name,'Portal Investor '+o.name)}if(b.dataset.directInvestor==='2'){const o=outletById(C.investors.investor2.outletId);return openViewer(route(o,'portal'),'Investor 2 • '+o.name,'Portal Investor '+o.name)}if(b.dataset.directInvestor==='3'){const o=outletById(C.investors.investor3.outletId);return openViewer(route(o,'portal'),'Investor 3 • '+o.name,'Portal Investor '+o.name)}});
  document.getElementById('viewerBack').addEventListener('click',()=>requestInnerBack(true));
  document.getElementById('viewerHome').addEventListener('click',()=>{closeViewer();home()});
  document.getElementById('viewerReload').addEventListener('click',()=>{if(currentUrl){showViewerLoading('Memuat ulang…');frame.src=currentUrl}});
  frame.addEventListener('load',()=>{if(frame.src!=='about:blank')hideViewerLoading()});
  window.addEventListener('message',ev=>{const d=ev&&ev.data;if(!d)return;if(d.type==='WILLS_PWA_BACK_HANDLED'){viewerBackAck=true;clearTimeout(viewerBackTimer);viewerBackTimer=null}else if(d.type==='WILLS_PWA_BACK_AT_ROOT'){viewerBackAck=true;clearTimeout(viewerBackTimer);viewerBackTimer=null;closeViewer();pushLauncherState(currentScreen||'home')}});

  window.addEventListener('popstate',()=>{if(viewer.classList.contains('show')){requestInnerBack(true);setTimeout(()=>{try{history.pushState({wills:true,screen:'viewer'},'',location.href)}catch(e){}},0);return}if(currentScreen==='investor1'){investorHome(false)}else if(currentScreen==='kasir'||currentScreen==='owner'||currentScreen==='investor'){home(false)}else{home(false)}setTimeout(()=>{try{history.pushState({wills:true,screen:currentScreen||'home'},'',location.href)}catch(e){}},0)});

  document.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length===1)touchStartY=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchmove',e=>{if(!e.touches||e.touches.length!==1)return;const dy=e.touches[0].clientY-touchStartY;if(dy>8&&window.scrollY<=0&&!viewer.classList.contains('show'))e.preventDefault()},{passive:false});

  ensureRootGuard();
  const params=new URLSearchParams(location.search),section=(params.get('section')||'').toLowerCase();if(section==='kasir')outletList('kasir',false);else if(section==='owner')outletList('owner',false);else if(section==='finance'||section==='hr')openCentral(section);else if(section==='investor')investorHome(false);else home(false);
  const splash=document.getElementById('splash');setTimeout(()=>splash.classList.add('hide'),700);
  const offline=document.getElementById('offline'),systemPill=document.getElementById('systemPill'),systemStatus=document.getElementById('systemStatus');function onlineState(){const online=navigator.onLine;offline.classList.toggle('show',!online);if(systemPill)systemPill.classList.toggle('offline',!online);if(systemStatus)systemStatus.textContent=online?'System Online':'System Offline'}window.addEventListener('online',onlineState);window.addEventListener('offline',onlineState);onlineState();document.getElementById('reloadNet').addEventListener('click',()=>location.reload());
  let installPrompt=null;const installCard=document.getElementById('installCard');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(!matchMedia('(display-mode: standalone)').matches)installCard.classList.add('show')});document.getElementById('installBtn').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;installCard.classList.remove('show')});document.getElementById('closeInstall').addEventListener('click',()=>installCard.classList.remove('show'));window.addEventListener('appinstalled',()=>installCard.classList.remove('show'));
  if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=10872').catch(()=>{}));
})();
</script>
</body>
</html>
